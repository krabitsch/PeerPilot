services:
  api:
    container_name: api
    build:
      context: ..
      dockerfile: api/Dockerfile
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    # TODO(phase-4): drop this host port mapping and use `expose: [3000]` so all
    # traffic has to go through nginx's TLS termination.
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - database-network
      - backend-network

networks:
  database-network:

  backend-network:

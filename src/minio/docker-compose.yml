services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - ../.env
    environment:
      # Credentials come from src/.env instead of the hardcoded minioadmin pair
      # the stack used to ship with. Same values the API authenticates with.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    # Object storage is reached through nginx's /files/ location, never
    # directly from the host. The console is dev-only (docker-compose.dev.yml).
    expose:
      - 9000
      - 9001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

volumes:
  minio_data:

networks:
  backend-network:

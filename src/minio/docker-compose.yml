services:
  minio:
    # MinIO stopped publishing community images in late 2025; the official
    # quay.io/minio/minio and minio/minio tags are gone. pgsty/minio is a
    # maintained community build of the same server, pinned. It bundles `mc`
    # and `curl`, so the healthcheck and the backup scripts (which run `mc`
    # inside this container) work without a separate client.
    # MINIO_IMAGE overrides it (e.g. a mirror, if Docker Hub is unavailable).
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - ../.env
    environment:
      # Credentials come from src/.env instead of the hardcoded minioadmin pair
      # the stack used to ship with. Same values the API authenticates with.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    # Object storage is reached through nginx's /files/ location, never
    # directly from the host. The console is dev-only (docker-compose.dev.yml).
    expose:
      - 9000
      - 9001
    restart: unless-stopped
    healthcheck:
      #test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

volumes:
  minio_data:

networks:
  backend-network:

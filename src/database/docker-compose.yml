services:
  database:

    container_name: database

    image: postgres:16-alpine

    networks:
      - database-network

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Reachable only from the database network. docker-compose.dev.yml maps it
    # to the host so Prisma migrate/studio/seed can run from your machine.
    expose:
      - 5432

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

    env_file:
      - ../.env

    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}


networks:
  database-network:


volumes:
  postgres_data:

# Plain HTTP serves only the ACME challenge (for Let's Encrypt) and otherwise
# redirects to HTTPS. All real traffic from outside the backend uses TLS.
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge. certbot writes the challenge files here
    # (shared volume); everything else is redirected to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # In production these are the real certificate mounted into /etc/nginx/ssl;
    # in development the entrypoint generates a self-signed pair at the same
    # paths. See nginx/entrypoint.sh and `make cert`.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Transfer limit: cap the size of any single request/upload body
    # accepted at the gateway (covers assignment & submission file uploads).
    client_max_body_size 200m;

    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    # One backend. /api/<module>/... maps straight onto the api service's
    # /<module>/... mount points, so all the old per-service paths still work.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
